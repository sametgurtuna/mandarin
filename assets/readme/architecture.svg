<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="430" rx="18" fill="#17120F"/>

  <g transform="translate(70,44)">
    <rect width="1060" height="106" rx="14" fill="#241A14" stroke="#FF8C2B" stroke-width="1.3"/>
    <text x="26" y="38" font-size="19" font-weight="700" fill="#FF9F45">Mandarin.App</text>
    <text x="150" y="38" font-size="14" fill="#7E6F63">WPF presentation layer</text>
    <text x="26" y="66" font-size="14" fill="#BFAE9E">Tray icon, floating panel, radial wheel, tool dialogs, settings</text>
    <text x="26" y="88" font-size="14" fill="#BFAE9E">MVVM via CommunityToolkit.Mvvm, themed with design tokens, localized EN and TR</text>
  </g>

  <line x1="380" y1="150" x2="380" y2="196" stroke="#4A382A" stroke-width="2"/>
  <line x1="880" y1="150" x2="880" y2="196" stroke="#4A382A" stroke-width="2"/>

  <g transform="translate(70,196)">
    <rect width="640" height="182" rx="14" fill="#1E1713" stroke="#3A2C22" stroke-width="1.3"/>
    <text x="26" y="38" font-size="19" font-weight="700" fill="#F2E7DC">Mandarin.Core</text>
    <text x="175" y="38" font-size="14" fill="#7E6F63">conversion engine</text>
    <text x="26" y="72" font-size="14" fill="#BFAE9E">Conversion      IConverter strategies and the format registry</text>
    <text x="26" y="98" font-size="14" fill="#BFAE9E">AdvancedTools   compress, crop, trim, split, redact, metadata</text>
    <text x="26" y="124" font-size="14" fill="#BFAE9E">Merge           multi file merge for PDF and media</text>
    <text x="26" y="156" font-size="13" fill="#FF8C2B">No reference to WPF or any UI framework.</text>
  </g>

  <g transform="translate(750,196)">
    <rect width="380" height="182" rx="14" fill="#1E1713" stroke="#3A2C22" stroke-width="1.3"/>
    <text x="26" y="38" font-size="19" font-weight="700" fill="#F2E7DC">Mandarin.Shell</text>
    <text x="26" y="72" font-size="14" fill="#BFAE9E">Explorer context menu verb</text>
    <text x="26" y="98" font-size="14" fill="#BFAE9E">Per user registry entry</text>
    <text x="26" y="124" font-size="14" fill="#BFAE9E">No COM server, no installer</text>
    <text x="26" y="156" font-size="13" fill="#FF8C2B">No admin rights required.</text>
  </g>
</svg>
