<svg width="1100" height="360" viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#201811"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff8c2b"/>
    </marker>
  </defs>
  <rect width="1100" height="360" fill="#15100c"/>

  <!-- Step 1 -->
  <g transform="translate(40,60)">
    <rect width="300" height="220" rx="18" fill="url(#card)" stroke="#3a2c1e" stroke-width="1.5"/>
    <circle cx="150" cy="70" r="42" fill="#3a2c1e"/>
    <path d="M150 45 v50 M130 75 l20 20 l20 -20" stroke="#ffb347" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#fdf6ee">Drag and drop</text>
    <text x="150" y="170" text-anchor="middle" font-size="15" fill="#c9b8a6">Drop a file onto the</text>
    <text x="150" y="192" text-anchor="middle" font-size="15" fill="#c9b8a6">floating panel, pick a format</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(400,60)">
    <rect width="300" height="220" rx="18" fill="url(#card)" stroke="#3a2c1e" stroke-width="1.5"/>
    <circle cx="150" cy="70" r="42" fill="#3a2c1e"/>
    <text x="150" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="#ffb347">Shift</text>
    <text x="150" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#fdf6ee">Instant convert</text>
    <text x="150" y="170" text-anchor="middle" font-size="15" fill="#c9b8a6">Converts to the last used</text>
    <text x="150" y="192" text-anchor="middle" font-size="15" fill="#c9b8a6">(or best guess) format</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(760,60)">
    <rect width="300" height="220" rx="18" fill="url(#card)" stroke="#3a2c1e" stroke-width="1.5"/>
    <circle cx="150" cy="70" r="42" fill="#3a2c1e"/>
    <text x="150" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#ffb347">Shift+Alt</text>
    <text x="150" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#fdf6ee">Advanced tools</text>
    <text x="150" y="170" text-anchor="middle" font-size="15" fill="#c9b8a6">Compress, crop, trim,</text>
    <text x="150" y="192" text-anchor="middle" font-size="15" fill="#c9b8a6">split, merge, strip metadata</text>
  </g>

  <line x1="345" y1="170" x2="395" y2="170" stroke="#ff8c2b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="705" y1="170" x2="755" y2="170" stroke="#ff8c2b" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
